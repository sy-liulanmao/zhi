
name: 直连规则集自动转换

'on':
  push:
    paths:
      - "direct.yaml"
      - ".github/workflows/convert.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库文件
        uses: actions/checkout@v4

      - name: 下载 Mihomo 转换工具
        shell: bash
        run: |
          set -e
          curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            -o release.json

          url=$(python3 -c '
          import json
          data = json.load(open("release.json"))
          assets = data.get("assets", [])
          matches = [
              a["browser_download_url"]
              for a in assets
              if "linux-amd64-compatible" in a["name"]
              and a["name"].endswith(".gz")
          ]
          if not matches:
              raise SystemExit("没有找到 Linux AMD64 压缩包")
          print(matches[0])
          ')

          curl -fL "$url" -o mihomo.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: 提取支持的域名规则
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("direct.yaml").read_text(encoding="utf-8-sig")
          rules = set()
          supported = {"DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "DOMAIN"}

          for line in text.splitlines():
              line = line.strip()

              if line.startswith("- "):
                  line = line[2:].strip()
              else:
                  continue

              parts = [x.strip() for x in line.split(",")]

              if len(parts) < 2 or parts[0] not in supported:
                  continue

              rule_type, value = parts[0], parts[1]

              if not value:
                  continue

              if rule_type in {"DOMAIN-SUFFIX", "DOMAIN"}:
                  value = value.lower().rstrip(".")
                  if not re.fullmatch(
                      r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?",
                      value
                  ):
                      continue
              else:
                  value = value.lower()

              rules.add(f"{rule_type},{value}")

          if not rules:
              raise SystemExit("没有找到支持的域名规则，停止转换")

          output = "\n".join(sorted(rules)) + "\n"
          Path("direct.txt").write_text(output, encoding="utf-8")

          print(f"提取完成，共 {len(rules)} 条规则")
          for kind in sorted(supported):
              count = sum(r.startswith(kind + ",") for r in rules)
              print(f"{kind}: {count} 条")
          PY

      - name: 转换为二进制规则集
        run: |
          set -e
          ./mihomo convert-ruleset domain text direct.txt direct.mrs
          test -s direct.mrs

      - name: 保存转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct.txt direct.mrs
          if ! git diff --cached --quiet; then
            git commit -m "自动更新直连二进制规则集"
            git push
          fi
