
name: 直连规则集自动转换

'on':
  push:
    paths:
      - "direct.yaml"
      - ".github/workflows/convert.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库文件
        uses: actions/checkout@v4

      - name: 下载 Mihomo 转换工具
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            -o release.json

          url=$(python3 -c '
          import json
          data = json.load(open("release.json"))
          assets = data.get("assets", [])
          matches = [
              a["browser_download_url"]
              for a in assets
              if "linux-amd64-compatible" in a["name"]
              and a["name"].endswith(".gz")
          ]
          if not matches:
              raise SystemExit("没有找到 Linux AMD64 压缩包")
          print(matches[0])
          ')

          curl -fL "$url" -o mihomo.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: 提取域名规则和关键词规则
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          text = Path("direct.yaml").read_text(
              encoding="utf-8-sig"
          )

          domain_rules = set()
          keyword_rules = set()

          supported = {
              "DOMAIN-SUFFIX",
              "DOMAIN",
              "DOMAIN-KEYWORD"
          }

          for raw in text.splitlines():
              line = raw.strip()

              if not line.startswith("- "):
                  continue

              parts = [
                  x.strip()
                  for x in line[2:].split(",")
              ]

              if len(parts) < 2:
                  continue

              kind, value = parts[0], parts[1]

              if kind not in supported or not value:
                  continue

              value = value.lower()

              if kind == "DOMAIN-SUFFIX":
                  domain_rules.add(value)

              elif kind == "DOMAIN":
                  domain_rules.add("full:" + value)

              elif kind == "DOMAIN-KEYWORD":
                  keyword_rules.add(value)

          if not domain_rules and not keyword_rules:
              raise SystemExit("没有找到支持的规则")

          Path("direct.txt").write_text(
              "\n".join(sorted(domain_rules)) + "\n"
              if domain_rules else "",
              encoding="utf-8"
          )

          keyword_yaml = ["payload:"]
          keyword_yaml.extend(
              "  - DOMAIN-KEYWORD," + keyword
              for keyword in sorted(keyword_rules)
          )

          Path("direct-keyword.yaml").write_text(
              "\n".join(keyword_yaml) + "\n",
              encoding="utf-8"
          )

          print(f"域名规则：{len(domain_rules)} 条")
          print(f"关键词规则：{len(keyword_rules)} 条")
          PY

      - name: 转换域名规则为 MRS
        shell: bash
        run: |
          set -euo pipefail

          if [ -s direct.txt ]; then
            ./mihomo convert-ruleset domain text direct.txt direct.mrs
            test -s direct.mrs
          else
            echo "没有域名规则，保留现有 direct.mrs"
          fi

      - name: 验证关键词规则文件
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("direct-keyword.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("关键词规则 YAML 格式错误")

          payload = data.get("payload", [])
          if not isinstance(payload, list):
              raise SystemExit("payload 格式错误")

          for rule in payload:
              if not rule.startswith("DOMAIN-KEYWORD,"):
                  raise SystemExit(f"发现非关键词规则：{rule}")

          print(f"关键词规则验证通过：{len(payload)} 条")
          PY

      - name: 保存转换结果
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add direct.txt direct.mrs direct-keyword.yaml

          if ! git diff --cached --quiet; then
            git commit -m "更新直连域名和关键词规则集"
            git push
          fi
